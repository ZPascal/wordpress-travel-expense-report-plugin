name: WP Plugin Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  wp-plugin-check:
    name: WP Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This action checks the plugin for many common errors and WordPress.org requirements
      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: '.'
