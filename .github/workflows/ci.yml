name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, gd
        coverage: none
        tools: composer

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: PHP Lint
      run: find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -exec php -l {} \;

  code-quality:
    name: Code Quality (PHPCS, PHPStan)
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, gd
        coverage: none
        tools: composer

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.2-

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPCS (WordPress Coding Standards)
      run: |
        composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
        composer require --dev wp-coding-standards/wpcs phpcompatibility/phpcompatibility-wp
        vendor/bin/phpcs --version
        vendor/bin/phpcs

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse -c phpstan.neon

  assets:
    name: Asset Build & Minification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Build minified assets
      run: npm run build

    - name: Verify minified files
      run: |
        test -f assets/js/travel-expense-report.min.js || exit 1
        test -f assets/js/travel-expense-report-localized.min.js || exit 1
        test -f assets/css/travel-expense-report.min.css || exit 1
        echo "✓ All minified files generated successfully"

    - name: Check file sizes
      run: |
        echo "Asset file sizes:"
        ls -lh assets/js/*.min.js assets/css/*.min.css
        echo "Original JS file size: $(stat -c%s assets/js/travel-expense-report.js) bytes"
        echo "Minified JS file size: $(stat -c%s assets/js/travel-expense-report.min.js) bytes"

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: Security Check (Composer)
      run: composer audit || true

    - name: Check for hardcoded credentials
      run: |
        if grep -r "password\|secret\|api_key\|token" --include="*.php" --include="*.js" . --exclude-dir=vendor --exclude-dir=node_modules | grep -v "^\s*//" | grep -v "^\s*\*"; then
          echo "⚠️ Warning: Found potential hardcoded credentials. Please review."
          exit 1
        fi

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [validate, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, gd
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPUnit tests
      run: composer test --verbose

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    needs: [assets, security]

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: WordPress Plugin Check
      uses: WordPress/plugin-check-action@v1
      with:
        build-dir: '.'
        slug: 'travel-expense-report'
        exclude-directories: |
          tests
          .github
        exclude-files: |
          .phpcs.xml.dist
          phpunit.xml.dist
          phpstan.neon
          .gitignore
          languages/generate-mo.php
